name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name tony_stark_hud_control tony_stark_hud_control.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tony_stark_hud_control-windows
          path: dist/tony_stark_hud_control.exe

  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (for cv2 + tkinter + matplotlib)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libgl1 libglib2.0-0 libsm6 libxrender1 libxext6 \
              libfontconfig1 libxkbcommon0 libxcb-xinerama0 \
              python3-tk tcl-dev tk-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --name tony_stark_hud_control tony_stark_hud_control.py

      - name: Compress binary into a .tar.gz with a launch script
        run: |
          mkdir -p release-staging
          cp dist/tony_stark_hud_control release-staging/
          cat > release-staging/tony_stark_hud_control.sh <<'EOF'
          #!/usr/bin/env bash
          # Launcher wrapper for the PyInstaller onefile build.
          # Sets MSYS_NO_PATHCONV=1 to keep OpenCV's GStreamer happy on
          # any WSL/Git-Bash hybrid environments, and DISPLAY for X11.
          set -e
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export MSYS_NO_PATHCONV=1
          export DISPLAY="${DISPLAY:-:0}"
          exec "$SCRIPT_DIR/tony_stark_hud_control" "$@"
          EOF
          chmod +x release-staging/tony_stark_hud_control release-staging/tony_stark_hud_control.sh
          tar -czf release-staging/tony_stark_hud_control-linux-x86_64.tar.gz \
              -C release-staging .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: tony_stark_hud_control-linux
          path: release-staging/tony_stark_hud_control-linux-x86_64.tar.gz

  build-source:
    name: Build source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history for git archive
          fetch-depth: 0

      - name: Create source tarball (with .git for provenance)
        run: |
          mkdir -p release-staging
          git archive --format=tar.gz --prefix="tony_stark_hand_control-${GITHUB_REF_NAME}/" \
              -o release-staging/tony_stark_hand_control-src.tar.gz HEAD

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: tony_stark_hud_control-source
          path: release-staging/tony_stark_hand_control-src.tar.gz

  release:
    name: Create GitHub release
    needs: [build-windows, build-linux, build-source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: tony_stark_hud_control-windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: tony_stark_hud_control-linux

      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: tony_stark_hud_control-source

      - name: Generate SHA256 checksums
        run: |
          sha256sum tony_stark_hud_control.exe \
                    tony_stark_hud_control-linux-x86_64.tar.gz \
                    tony_stark_hand_control-src.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tony_stark_hud_control.exe
            tony_stark_hud_control-linux-x86_64.tar.gz
            tony_stark_hand_control-src.tar.gz
            SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
