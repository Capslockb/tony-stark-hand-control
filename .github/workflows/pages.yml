name: Deploy promo site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render social card JPEG (with grain baked in)
        run: |
          pip install --quiet cairosvg numpy Pillow
          python3 - <<'PYEOF'
          import cairosvg
          from PIL import Image
          cairosvg.svg2png(
              url='site/assets/social-card.svg',
              write_to='/tmp/card-clean.png',
              output_width=1200, output_height=630,
          )
          img = Image.open('/tmp/card-clean.png').convert('RGBA')
          grain_tile = Image.open('site/assets/grain.png').convert('RGBA')
          layer = Image.new('RGBA', img.size, (0, 0, 0, 0))
          for y in range(0, img.size[1], 120):
              for x in range(0, img.size[0], 120):
                  layer.paste(grain_tile, (x, y))
          layer.putalpha(layer.split()[3].point(lambda v: int(v * 0.4)))
          img.alpha_composite(layer)
          result = img.convert('RGB')
          result.save(
              'site/assets/social-card.jpg', 'JPEG',
              quality=85, optimize=True, progressive=True,
          )
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
