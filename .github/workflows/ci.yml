name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgles2 xauth xvfb

      - name: Verify selected Python includes Tk
        run: |
          python -c "import sys, tkinter; print(f'{sys.executable}: Tk {tkinter.TkVersion}')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -m unittest discover tests -v

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m unittest discover tests -v

      - name: Install wizard smoke test
        shell: bash
        run: |
          python -c "import ast; ast.parse(open('install_wizard.py').read()); print('install_wizard.py: OK')"
          python -c "import ast; ast.parse(open('tony_stark_hud_control.py').read()); print('main app: OK')"
